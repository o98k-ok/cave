name: Build DMG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app bundle
        run: ./build.sh

      - name: Package DMG
        run: |
          mkdir -p dist
          hdiutil create \
            -volname "cave" \
            -srcfolder "build/cave.app" \
            -ov \
            -format UDZO \
            "dist/cave.dmg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cave-dmg
          path: dist/cave.dmg

      - name: Upload to GitHub Release (optional manual run on tag ref)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cave.dmg
