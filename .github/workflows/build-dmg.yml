name: Build DMG

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload DMG to GitHub Release"
        required: true
        default: false
        type: boolean
      tag:
        description: "Release tag (required when upload_release=true), e.g. v1.0.3"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64 binary
        run: swift build -c release --arch arm64

      - name: Save arm64 binary
        run: |
          mkdir -p .artifacts
          cp .build/arm64-apple-macosx/release/cave .artifacts/cave-arm64

      - name: Build x86_64 binary
        run: swift build -c release --arch x86_64

      - name: Save x86_64 binary
        run: |
          cp .build/x86_64-apple-macosx/release/cave .artifacts/cave-x86_64

      - name: Create universal app bundle
        run: |
          APP_NAME="cave"
          APP_BUNDLE="build/${APP_NAME}.app"
          CONTENTS="${APP_BUNDLE}/Contents"
          rm -rf "$APP_BUNDLE"
          mkdir -p "${CONTENTS}/MacOS"
          mkdir -p "${CONTENTS}/Resources"

          lipo -create \
            .artifacts/cave-arm64 \
            .artifacts/cave-x86_64 \
            -output "${CONTENTS}/MacOS/${APP_NAME}"

          chmod +x "${CONTENTS}/MacOS/${APP_NAME}"
          cp "Info.plist" "${CONTENTS}/"
          echo -n "APPL????" > "${CONTENTS}/PkgInfo"

      - name: Verify universal binary
        run: lipo -info build/cave.app/Contents/MacOS/cave

      - name: Package DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg-root
          cp -R build/cave.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "cave" \
            -srcfolder "dist/dmg-root" \
            -ov \
            -format UDZO \
            "dist/cave.dmg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cave-dmg
          path: dist/cave.dmg

      - name: Validate release inputs
        if: ${{ inputs.upload_release }}
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "input 'tag' is required when upload_release=true"
            exit 1
          fi

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/cave.dmg
